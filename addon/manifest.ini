name = progressPulse
summary = "Progress Pulse"
description = """Plays pleasant sounds for progress bars instead of NVDA's beeps: 15 built-in sounds, or your own WAV files. Choose separate sounds for the start, halfway point and end of a progress bar, let the pitch rise and the sound move from left to right as progress goes up, and hear an announcement such as "Download complete" when a progress bar finishes. Settings are in NVDA menu, Preferences, Settings, Progress Pulse."""
author = "Mohd Farhan Hussain <the.flame.falcon6@gmail.com>"
url = https://github.com/mohd-farhan-developer/Progress_Pulse
version = 1.1.0
docFileName = readme.html
minimumNVDAVersion = 2022.1.0
lastTestedNVDAVersion = 2026.2.0
changelog = """* 10 new built-in sounds, making 15 in total:
  * For progress: Heartbeat, Kalimba, Glass tap, Wood knock, Soft pluck and Pop.
  * For when a progress bar starts: Rising whoosh.
  * For the halfway point: Ding-dong.
  * For when a progress bar finishes: Single bell and Level complete.
* Works with NVDA 2026.2."""
